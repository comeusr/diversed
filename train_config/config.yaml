seed: 42
exp_name: ensemble_rl_training
datasets:
  - cnndm
debug: false
wandb:
  enabled: true
  entity: null
  project: Ensemble_RL
cache_dir: ../data/
local_run_dir: ${cache_dir}/${datasets[0]}/model/${exp_name}
do_first_eval: true
minimum_log_interval_secs: 1.0
intermediate_checkpoints: true
trainer: ReinforceTrainer
lr: 5e-4
n_epochs: 1
global_epochs: 2
n_examples: 400
n_eval_examples: 100
eval_every: 50
optimizer: AdamW
warmup_steps: 10
cache_reference_logprobs: false
load_reference_logprobs: null
frac_unique_desirable: 1.0
frac_unique_undesirable: 1.0
model:
  target_name_or_path: meta-llama/Llama-3.1-8B-Instruct
  draft_name_or_path: meta-llama/Llama-3.2-1B-Instruct
  tokenizer_name_or_path: null
  load_from: null
  from_checkpoint: null
  policy_dtype: bfloat16
  reference_dtype: bfloat16
  max_grad_norm: 5.0
  v_head_max_grad_norm: 0.1
  max_length: 640
  max_prompt_length: 512
  max_tokens: 128
  activation_checkpointing: true
  batch_size: 8
  eval_microbatch_size: 4
  gradient_accumulation_steps: 1
  eval_batch_size: 8
  attn_implementation: flash_attention_2
  use_peft: false
  summary_dropout_prob: 0.1
  load_lora_from: null
  do_sample: false
  temperature: 0.0
  reg_scale: 10
  target_w_draft: 0.5
  save_freqs: 4
  peft:
    lora_r: 64
    lora_alpha: 256
    lora_dropout: 0.05
    target_modules: all-linear
loss:
  trainer: ReinforceTrainer
  dataloader: SFTDataLoader
