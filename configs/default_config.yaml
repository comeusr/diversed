# Default configuration for DIVERSED

# Model configuration
model:
  target_model: "meta-llama/Llama-3.1-8B-Instruct"  # Target model name or path
  draft_model: "meta-llama/Llama-3.2-1B-Instruct"   # Draft model name or path
  policy_dtype: "float16"                           # Data type for policy model
  attn_implementation: "flash_attention_2"          # Attention implementation
  max_length: 2048                                  # Maximum sequence length
  max_prompt_length: 1024                           # Maximum prompt length
  max_tokens: 128                                   # Maximum tokens to generate
  batch_size: 8                                     # Batch size
  eval_microbatch_size: 8                           # Evaluation micro-batch size
  gradient_accumulation_steps: 1                    # Gradient accumulation steps
  max_grad_norm: 1.0                               # Maximum gradient norm
  do_sample: false                                  # Whether to use sampling
  temperature: 0.2                                  # Temperature for sampling
  reg_scale: 5.0                                    # Regularization scale
  target_w_draft: 0.6                               # Target draft weight
  save_freqs: 500                                   # Save frequency

# Training configuration
optimizer: "AdamW"                                  # Optimizer
lr: 5e-4                                            # Learning rate
warmup_steps: 100                                   # Warmup steps
global_epochs: 2                                    # Number of epochs
n_examples: 400                                     # Number of examples
n_eval_examples: 100                                # Number of evaluation examples
n_epochs: 1                                         # Number of epochs
seed: 42                                            # Random seed
minimum_log_interval_secs: 10                       # Minimum logging interval
debug: false                                        # Debug mode
intermediate_checkpoints: true                      # Save intermediate checkpoints
do_first_eval: true                                 # Do first evaluation
eval_every: 1000                                    # Evaluation frequency

# Dataset configuration
datasets: ["cnndm"]                                 # Datasets
frac_unique_desirable: 1.0                          # Fraction of unique desirable examples
frac_unique_undesirable: 1.0                        # Fraction of unique undesirable examples

# Loss configuration
loss:
  gamma: 1.0                                        # Discount factor
  lam: 0.95                                         # Lambda for GAE
  critic_coef: 0.5                                  # Critic coefficient
  KL_coef: 0.1                                      # KL coefficient
  cliprange: 0.2                                    # PPO clip range
  ppo_epochs: 4                                     # PPO epochs
  control_tokens: {}                                # Control tokens

# Logging configuration
wandb:
  enabled: false                                    # Whether to use Weights & Biases
  project: "diversed"                               # Weights & Biases project
  entity: "anonymous"                               # Weights & Biases entity

# Paths
local_run_dir: "./output"                           # Local run directory
cache_dir: "./.cache"                               # Cache directory
